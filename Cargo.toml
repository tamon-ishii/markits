[package]
name = "markits"
version = "0.1.0"
edition = "2024"

[lib]
name = "markits"
path = "src/lib.rs"

[[bin]]
name = "markits"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
