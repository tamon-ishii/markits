[package]
name = "markits"
version = "0.7.5"
edition = "2024"

[workspace]
members = [
    ".",
    "apps/desktop/src-tauri",
]

[lib]
name = "markits"
path = "src/lib.rs"

[[bin]]
name = "markits"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[dependencies]
rdev = "0.5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "raster-images"] }
screenshots = "0.8.10"
xa11y = { version = "0.15.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
x11rb = { version = "0.13.2", features = ["composite"] }
ashpd = { version = "0.13.13", default-features = false, features = ["screenshot", "tokio"] }
url = "2.5"
tokio = { version = "1.51", features = ["rt", "time"] }
zbus = { version = "5", features = ["blocking"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
xcap = "=0.4.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
