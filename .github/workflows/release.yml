name: Release

permissions:
  contents: write

on:
  push:
    tags:
      # GitHub Actions uses glob patterns here, not regular expressions.
      # Keep the prefix broad so semantic-version tags such as v0.6.0 trigger
      # the release build.
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty to use version from Cargo.toml, e.g. v0.5.0)'
        required: false
        default: ''

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: release-tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
            else
              VERSION=$(grep '^version = ' Cargo.toml | head -n 1 | cut -d '"' -f 2)
              TAG="v${VERSION}"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG does not exist on remote, creating..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG" || true
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, proceeding to upload assets."
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" --title "MarkIts $TAG" --generate-notes
          fi

  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: universal-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build and upload release binary to GitHub Release
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: markits
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          include: LICENSE,README.md
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refs/tags/${{ needs.create-release.outputs.tag }}

      - name: Upload archive as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: markits-cli-${{ matrix.target }}
          path: |
            markits-*.tar.gz
            markits-*.zip
            target/${{ matrix.target }}/release/markits*
          if-no-files-found: ignore

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            args: ""
            rust_targets: ""
          - os: macos-latest
            platform: macos-universal
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - os: windows-latest
            platform: windows
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Build and release Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseName: "MarkIts ${{ needs.create-release.outputs.tag }}"
          releaseBody: "MarkIts Desktop GUI Release ${{ needs.create-release.outputs.tag }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Desktop Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: markits-desktop-${{ matrix.platform }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.app.tar.gz
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.zip
            target/*/release/bundle/**/*.deb
            target/*/release/bundle/**/*.AppImage
            target/*/release/bundle/**/*.dmg
            target/*/release/bundle/**/*.app.tar.gz
            target/*/release/bundle/**/*.msi
            target/*/release/bundle/**/*.exe
            target/*/release/bundle/**/*.zip
            apps/desktop/src-tauri/target/**/bundle/**/*
          if-no-files-found: ignore
